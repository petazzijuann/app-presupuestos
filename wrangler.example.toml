# Referencia para desarrollo local:
#   npx wrangler pages dev dist -c wrangler.example.toml
#
# OJO: este archivo NO se llama wrangler.toml a propósito. Si existiera un
# wrangler.toml en la raíz, el build de Cloudflare Pages pasa a usarlo como
# única fuente de verdad (ejecuta `wrangler deploy` y deja de leer las
# variables y los bindings del panel). En producción, el KV y las variables
# se configuran en el panel de Pages.
name = "costos"
pages_build_output_dir = "dist"
compatibility_date = "2025-10-01"

[vars]
PRODUCT_ID = "costos"
MAX_DEVICES = "3"
# LS_PRODUCT_ID y ADMIN_TOKEN se cargan como secretos en el panel de Pages.

[[kv_namespaces]]
binding = "LICENSES"
id = "73b4fa6f7ed040b794c860f97e7fe537"
